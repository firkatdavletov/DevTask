[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-task"
version = "0.2.0"
description = "Project-independent Codex task orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
dev-task = "dev_task.cli:main"

[tool.setuptools]
packages = ["dev_task"]

[tool.setuptools.package-data]
dev_task = ["copy-worktree-local.sh"]
